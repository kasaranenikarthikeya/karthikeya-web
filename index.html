<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karthikeya K. | Crafting Unique & Good Digital Experiences</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFFFFF; /* Base background */
      color: #1F2937; /* Base text color (gray-800) */
      scroll-behavior: smooth;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F3F4F6; /* gray-100 */
    }
    ::-webkit-scrollbar-thumb {
      background: #FDBA74; /* amber-400 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FB923C; /* orange-500 */
    }
    /* Text Selection Color */
    ::selection {
      background-color: #FDBA74; /* amber-400 */
      color: #1F2937; 
    }
    /* Keyframes for subtle fade-in or slide-in, if needed by AnimatedSection */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary': '#FDBA74', // amber-400 (Primary Yellow/Orange)
            'brand-secondary': '#FB923C', // orange-500 (Darker Orange for hover/accents)
            'brand-text': '#1F2937', // gray-800
            'brand-bg-light': '#F9FAFB', // gray-50
            'brand-bg-white': '#FFFFFF',
            'brand-bg-dark-section': '#FFFBEB', // very light yellow for some sections if needed like work experience
          },
          fontFamily: {
            'sans': ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
